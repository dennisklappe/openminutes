<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Microsoft Teams</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        margin: 2rem;
      }
      [hidden] {
        display: none !important;
      }
      li {
        list-style: none;
      }
    </style>
  </head>
  <body>
    <h1>How do you want to join your Teams meeting?</h1>
    <button>Download the Windows app</button>
    <button data-tid="joinOnWeb" id="web">Continue on this browser</button>
    <button>Open your Teams app</button>
    <script>
      document.getElementById('web').addEventListener('click', () => {
        location.href =
          '/fixture/' +
          (new URLSearchParams(location.search).has('blocked') ? 'blocked' : 'prejoin') +
          location.search;
      });
    </script>
  </body>
</html>
