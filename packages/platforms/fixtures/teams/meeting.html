<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Microsoft Teams</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        margin: 2rem;
      }
      li {
        list-style: none;
      }
      [data-stream-type='Video'] {
        display: inline-block;
        width: 12rem;
        margin: 0.5rem;
        padding: 2rem 0;
        text-align: center;
        background: #292929;
        color: #fff;
      }
      [data-tid='voice-level-stream-outline'] {
        margin-top: 0.5rem;
        height: 4px;
        background: #6264a7;
      }
    </style>
  </head>
  <body>
    <audio id="tone" loop></audio>
    <div id="stage"></div>
    <video id="self-view" width="320" height="180" muted playsinline></video>
    <button data-tid="toggle-mute" id="mic-button" aria-label="Mute mic">Mic</button>
    <button aria-label="Chat" aria-pressed="false" id="chat-toggle">Chat</button>
    <aside id="chat" hidden>
      <div data-tid="message-pane-list-viewport" id="chat-log"></div>
      <div data-tid="ckeditor" contenteditable="true" role="textbox"></div>
      <button data-tid="newMessageCommands-send" id="chat-send">Send</button>
    </aside>
    <button id="hangup-button" title="Leave">Leave</button>
    <script>
      const params = new URLSearchParams(location.search);
      const number = (key, fallback) => (params.has(key) ? Number(params.get(key)) : fallback);
      const self = params.get('name') || 'OpenMinutes Notetaker';
      const others = (params.get('others') ?? 'Alice,Bob').split(',').filter(Boolean);
      const $ = (id) => document.getElementById(id);
      let micTrack;
      let micPeak = 0;
      // micLocked ignores every mute press, micOnAfterJoin models Teams unmuting the guest.
      const setMic = (on) => {
        document.body.dataset.mic = on ? 'on' : 'off';
        $('mic-button').setAttribute('aria-label', on ? 'Mute mic' : 'Unmute mic');
        if (micTrack) micTrack.enabled = on;
      };
      setMic(params.get('mic') === 'true' || params.has('micOnAfterJoin'));
      $('mic-button').addEventListener('click', () => {
        if (!params.has('micLocked')) setMic(document.body.dataset.mic !== 'on');
      });
      async function openMic() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micTrack = stream.getAudioTracks()[0];
        micTrack.enabled = document.body.dataset.mic === 'on';
        const context = new AudioContext();
        const analyser = context.createAnalyser();
        const silencer = context.createGain();
        silencer.gain.value = 0;
        context.createMediaStreamSource(new MediaStream([micTrack])).connect(analyser);
        analyser.connect(silencer).connect(context.destination);
        const samples = new Float32Array(analyser.fftSize);
        setInterval(() => {
          analyser.getFloatTimeDomainData(samples);
          micPeak = Math.max(micPeak, ...samples.map(Math.abs));
          document.body.dataset.micPeak = micPeak.toFixed(3);
        }, 50);
      }
      openMic();
      document.body.dataset.camera = params.get('camera') === 'true' ? 'on' : 'off';

      const schedule = (key) =>
        (params.get(key) ?? '')
          .split(',')
          .filter(Boolean)
          .map((entry) => {
            const [name, range] = entry.split(':');
            const [from, to] = range.split('-').map(Number);
            return { name, from, to };
          });
      const speakers = schedule('speakers');
      const joins = schedule('joins');
      const leaves = schedule('leaves');
      const within = (list, name, at) =>
        list.some((e) => e.name === name && at >= e.from && (e.to === undefined || at < e.to));

      function render(people, speaking) {
        if (people.length === 1) {
          $('stage').replaceChildren(
            Object.assign(document.createElement('h2'), {
              textContent: 'Waiting for others to join...',
            }),
          );
          return;
        }
        $('stage').replaceChildren(
          ...people.map((person) => {
            const tile = document.createElement('div');
            tile.dataset.tid = person;
            tile.dataset.streamType = 'Video';
            tile.append(person);
            const outline = document.createElement('div');
            outline.dataset.tid = 'voice-level-stream-outline';
            if (speaking.includes(person)) outline.className = 'vdi-frame-occlusion';
            tile.append(outline);
            return tile;
          }),
        );
      }

      const report = (event) =>
        fetch('/__event', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(event),
        }).catch(() => undefined);

      async function showCamera() {
        const video = $('self-view');
        video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
        await video.play();
        const canvas = Object.assign(document.createElement('canvas'), { width: 160, height: 90 });
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, 160, 90);
        const pixels = context.getImageData(0, 0, 160, 90).data;
        const mean = [0, 1, 2].map((channel) => {
          let sum = 0;
          for (let i = channel; i < pixels.length; i += 4) sum += pixels[i];
          return Math.round(sum / (pixels.length / 4));
        });
        document.body.dataset.cameraFrame = mean.join(',');
        report({ type: 'camera-frame', mean, image: canvas.toDataURL('image/png') });
      }

      $('chat-toggle').addEventListener('click', () => {
        $('chat').hidden = !$('chat').hidden;
        $('chat-toggle').setAttribute('aria-pressed', String(!$('chat').hidden));
      });

      const linked = (text) =>
        text.replace(/https?:\/\/[^\s<]+/g, (url) => `<a href="${url}" target="_blank">${url}</a>`);
      let lastAuthor = '';
      const addChat = (sender, text) => {
        const item = document.createElement('div');
        item.setAttribute('data-tid', 'chat-pane-item');
        const author = sender === lastAuthor ? '' : '<span data-tid="message-author-name"></span>';
        item.innerHTML = `${author}<time datetime="${new Date().toISOString()}"></time><div data-tid="chat-pane-message"></div>`;
        if (author) item.querySelector('[data-tid="message-author-name"]').textContent = sender;
        if (sender === 'You') item.querySelector('[data-tid="chat-pane-message"]').dataset.own = '';
        item.querySelector('[data-tid="chat-pane-message"]').innerHTML = linked(
          text.replace(/&/g, '&amp;').replace(/</g, '&lt;'),
        );
        lastAuthor = sender;
        $('chat-log').append(item);
      };
      const seededChat = (
        params.get('chat') ?? 'Alice|2000|I will send the url: https://example.com/agenda'
      )
        .split(';')
        .filter(Boolean)
        .map((entry) => entry.split('|'));
      for (const [from, after, text] of seededChat)
        setTimeout(() => addChat(from, text), Number(after));
      $('chat-send').addEventListener('click', () => {
        const input = document.querySelector('[data-tid="ckeditor"]');
        const text = input.textContent.trim();
        if (!text) return;
        addChat('You', text);
        document.body.dataset.chat = text;
        report({ type: 'chat', text });
        input.textContent = '';
      });

      function tone() {
        const rate = 16000;
        const samples = new Int16Array(rate);
        for (let i = 0; i < rate; i++)
          samples[i] = Math.sin((2 * Math.PI * 440 * i) / rate) * 12000;
        const header = new DataView(new ArrayBuffer(44));
        const text = (offset, value) =>
          [...value].forEach((c, i) => header.setUint8(offset + i, c.charCodeAt(0)));
        text(0, 'RIFF');
        header.setUint32(4, 36 + samples.byteLength, true);
        text(8, 'WAVEfmt ');
        header.setUint32(16, 16, true);
        header.setUint16(20, 1, true);
        header.setUint16(22, 1, true);
        header.setUint32(24, rate, true);
        header.setUint32(28, rate * 2, true);
        header.setUint16(32, 2, true);
        header.setUint16(34, 16, true);
        text(36, 'data');
        header.setUint32(40, samples.byteLength, true);
        return URL.createObjectURL(new Blob([header, samples], { type: 'audio/wav' }));
      }

      report({
        type: 'joined',
        platform: 'teams',
        name: self,
        camera: params.get('camera') === 'true',
      });
      if (params.get('camera') === 'true') showCamera();
      $('tone').src = tone();
      $('tone')
        .play()
        .catch(() => undefined);
      const joinedAt = Date.now();
      const tick = () => {
        const at = Date.now() - joinedAt;
        const gone = params.has('leaveAfter') && at >= number('leaveAfter', 0);
        const present = [
          ...others.filter((n) => !gone && !within(leaves, n, at)),
          ...joins.filter((e) => !gone && at >= e.from).map((e) => e.name),
          self,
        ].filter((n, i, all) => all.indexOf(n) === i);
        render(
          present,
          speakers.filter((e) => at >= e.from && at < e.to).map((e) => e.name),
        );
      };
      tick();
      setInterval(tick, 100);
      $('hangup-button').addEventListener('click', () => {
        $('tone').pause();
        location.href = '/fixture/left';
      });
    </script>
  </body>
</html>
