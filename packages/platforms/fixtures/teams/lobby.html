<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Microsoft Teams</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        margin: 2rem;
      }
      [hidden] {
        display: none !important;
      }
      li {
        list-style: none;
      }
    </style>
  </head>
  <body>
    <h1>Hi, OpenMinutes Notetaker. Someone will let you in shortly.</h1>
    <script>
      const params = new URLSearchParams(location.search);
      const wait = params.has('lobby') ? Number(params.get('lobby')) : 1500;
      setTimeout(() => {
        location.href =
          '/fixture/' +
          (params.has('deny') ? 'denied' : params.has('endedLobby') ? 'ended' : 'meeting') +
          location.search;
      }, wait);
    </script>
  </body>
</html>
