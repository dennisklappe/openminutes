name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'brand/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # Only the upstream repository deploys the site: forks have no Cloudflare secrets.
    if: github.repository == 'dennisklappe/openminutes'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser that renders the docs diagrams
        run: pnpm --filter @openminutes/site exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Read the star count once, for the footer link
        run: echo "PUBLIC_GITHUB_STARS=$(gh api repos/${{ github.repository }} --jq .stargazers_count)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm --filter @openminutes/site build
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
      - run: pnpm dlx wrangler@4 pages deploy site/dist --project-name openminutes-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
