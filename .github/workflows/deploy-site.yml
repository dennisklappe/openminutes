name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'brand/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # Only the upstream repository deploys the site: forks have no Cloudflare secrets.
    if: github.repository == 'dennisklappe/openminutes'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser that renders the docs diagrams
        run: pnpm --filter @openminutes/site exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Read the star count once, for the footer link
        run: echo "PUBLIC_GITHUB_STARS=$(gh api repos/${{ github.repository }} --jq .stargazers_count)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm --filter @openminutes/site build
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
      - run: pnpm dlx wrangler@4 pages deploy site/dist --project-name openminutes-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
