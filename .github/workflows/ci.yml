name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      # Type-aware linting of the whole monorepo needs more than the default heap on small runners.
      NODE_OPTIONS: --max-old-space-size=4096
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser that renders the docs diagrams
        run: pnpm --filter @openminutes/site exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
