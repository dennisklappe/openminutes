name: Docker build check

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pnpm-lock.yaml
      - apps/bot/docker-entrypoint.sh
      - services/whisper/**
      - .github/workflows/docker-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || vars.DOCKER_CHECK_ON_PR == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { context: ., target: web }
          - { context: ., target: worker }
          - { context: ., target: bot }
          - { context: services/whisper }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=check-${{ matrix.target || 'whisper' }}
          cache-to: type=gha,scope=check-${{ matrix.target || 'whisper' }},mode=max
